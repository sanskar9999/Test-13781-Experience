<!DOCTYPE html>
<html lang="zxx">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ec">
<title>○</title>
<style>
  :root{
    --paper:#f6f3ec;
    --card:rgba(255,255,255,.82);
    --line:rgba(60,55,50,.08);
    --ink:#8a8783;
    --accent:#4d7cfe;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--paper);
    overflow:hidden;
    overscroll-behavior:none;
    font-family:system-ui,-apple-system,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    min-height:100dvh;
    user-select:none;
    -webkit-user-select:none;
  }
  #photo{
    border-radius:28px;
    box-shadow:0 18px 44px rgba(90,80,70,.16), 0 3px 10px rgba(90,80,70,.10);
    touch-action:none;
    cursor:pointer;
    background:#fff;
  }
  #blocks{display:block;opacity:.9}
  .dock{
    display:flex;
    gap:12px;
    padding:10px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    box-shadow:0 10px 30px rgba(90,80,70,.12), 0 2px 8px rgba(90,80,70,.08);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }
  .btn{
    width:54px;
    height:54px;
    border-radius:999px;
    border:1px solid var(--line);
    background:#fff;
    display:grid;
    place-items:center;
    cursor:pointer;
    padding:0;
    box-shadow:0 4px 14px rgba(90,80,70,.10);
    transition:transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .35s ease;
  }
  .btn:hover{transform:translateY(-1px) scale(1.03);box-shadow:0 8px 20px rgba(90,80,70,.14)}
  .btn:active{transform:scale(.96)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .btn svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .btn[aria-pressed="true"]{background:#eef3ff;border-color:rgba(77,124,254,.45)}
  .btn[aria-pressed="true"] svg{stroke:var(--accent)}
  .modes{
    display:flex;
    gap:8px;
    padding:8px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    box-shadow:0 8px 22px rgba(90,80,70,.10), 0 2px 6px rgba(90,80,70,.07);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }
  .modes .btn{width:46px;height:46px;box-shadow:0 3px 10px rgba(90,80,70,.08)}
  .modes .btn svg{width:22px;height:22px}
  .orb{width:22px;height:22px;border-radius:50%;background:conic-gradient(#f6c177,#a8c5b5,#a9c6e8,#d9a7c0,#f6c177);opacity:.92}
  .sense{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 18px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    box-shadow:0 8px 22px rgba(90,80,70,.10), 0 2px 6px rgba(90,80,70,.07);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    color:var(--ink);
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
  }
  .sense input{
    width:170px;
    accent-color:var(--accent);
    cursor:pointer;
  }
  #file{display:none}
  #dbg{
    display:none;
    position:fixed;
    left:8px;
    right:8px;
    top:8px;
    max-height:38dvh;
    overflow:auto;
    background:rgba(20,18,16,.88);
    color:#f2ede4;
    font:11px/1.5 ui-monospace,Menlo,monospace;
    white-space:pre-wrap;
    word-break:break-word;
    border-radius:12px;
    padding:10px 12px;
    z-index:50;
  }
</style>
</head>
<body>
<canvas id="photo" aria-label="touch the photo"></canvas>
<canvas id="blocks" aria-hidden="true"></canvas>
<div class="modes">
  <button id="bTouch" class="btn" aria-label="touch" aria-pressed="true">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M6.3 6.3 C4.6 8 3.8 10 3.8 12"/><path d="M17.7 6.3 C19.4 8 20.2 10 20.2 12"/><path d="M6.3 17.7 C4.6 16 3.8 14 3.8 12"/><path d="M17.7 17.7 C19.4 16 20.2 14 20.2 12"/></svg>
  </button>
  <button id="bDream" class="btn" aria-label="dream" aria-pressed="false">
    <span class="orb"></span>
  </button>
  <button id="bGaze" class="btn" aria-label="gaze" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path d="M3 12 C6 7.6 9.4 6 12 6 C14.6 6 18 7.6 21 12 C18 16.4 14.6 18 12 18 C9.4 18 6 16.4 3 12 Z"/><circle cx="12" cy="12" r="2.6"/></svg>
  </button>
</div>
<div class="dock">
  <button id="bPrev" class="btn" aria-label="previous">
    <svg viewBox="0 0 24 24"><path d="M14.5 6 C14.5 6 9 10.2 9 12 C9 13.8 14.5 18 14.5 18"/></svg>
  </button>
  <button id="bUp" class="btn" aria-label="upload">
    <svg viewBox="0 0 24 24"><path d="M12 16 L12 5.5"/><path d="M7.5 10 L12 5.5 L16.5 10"/><path d="M5 19.5 C5 19.5 7.5 20.5 12 20.5 C16.5 20.5 19 19.5 19 19.5"/></svg>
  </button>
  <button id="bNext" class="btn" aria-label="next">
    <svg viewBox="0 0 24 24"><path d="M9.5 6 C9.5 6 15 10.2 15 12 C15 13.8 9.5 18 9.5 18"/></svg>
  </button>
</div>
<div class="sense">
  <span>sensitivity</span>
  <input id="sense" type="range" min="0.3" max="0.9" step="0.01" value="0.3" aria-label="sensitivity">
</div>
<input id="file" type="file" accept="image/*">
<div id="dbg" aria-hidden="true"></div>
<script type="module">
import { AutoModel, AutoImageProcessor, RawImage } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0';
import { slicePatchTokens, normalizeRows, similarityMap, pointToCell, simToAlpha, sliceCls, pca3 } from './touch.js';

const MODEL = 'onnx-community/dinov3-vits16-pretrain-lvd1689m-ONNX';
const N_BLOCKS = 12;
const SAMPLES = ['images/dog.jpg', 'images/cats.jpg', 'images/chonk.jpg'];

const photo = document.getElementById('photo');
const pctx = photo.getContext('2d');
const strip = document.getElementById('blocks');
const sctx = strip.getContext('2d');
const bPrev = document.getElementById('bPrev');
const bNext = document.getElementById('bNext');
const bUp = document.getElementById('bUp');
const file = document.getElementById('file');
const senseEl = document.getElementById('sense');

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (dt, s) => 1 - Math.exp(-dt * s);
const rand = (a, b) => a + Math.random() * (b - a);

let side = 300;
let DPR = 1;
let square = document.createElement('canvas'); // square-cropped source photo
let feats = null; // normalized patch features
let grid = 0;
let dim = 0;
let target = null;
let shown = null;
let tapped = -1;
let mode = 'touch'; // touch | dream | gaze
let cut = 0.3; // strictness threshold: higher = tighter match region
let clsSims = null;
let gazeShown = null;
let dreamRGB = null;
let dreamShown = null;
let downInfo = null;
let ready = false; // model + features for current photo
let modelLoading = true;
let brainDead = false;
let loadFrac = 0;
let sweep = -1; // inference sweep position, -1 idle
let ripples = [];
let sampleIdx = 0;
let customURL = null;
let tGlobal = rand(0, 100);
let last = performance.now();
const mask = document.createElement('canvas'); // low-res veil mask
const grey = document.createElement('canvas'); // desaturated + dimmed photo, built per photo
const work = document.createElement('canvas'); // scratch layer for the grey spotlight
const dbgEl = document.getElementById('dbg');
const DEBUG = new URLSearchParams(location.search).has('debug');
if (DEBUG) dbgEl.style.display = 'block';
function log(msg) {
  const line = '[' + ((performance.now() / 1000).toFixed(1)) + 's] ' + msg;
  console.log('[touch]', line);
  if (!DEBUG) return;
  dbgEl.textContent += line + '\n';
  const lines = dbgEl.textContent.split('\n');
  if (lines.length > 60) dbgEl.textContent = lines.slice(-60).join('\n');
  dbgEl.scrollTop = dbgEl.scrollHeight;
}

function rr(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  side = Math.max(240, Math.min(window.innerWidth - 32, window.innerHeight - 382, 560));
  photo.width = Math.floor(side * DPR);
  photo.height = Math.floor(side * DPR);
  photo.style.width = side + 'px';
  photo.style.height = side + 'px';
  pctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sw = N_BLOCKS * 22;
  strip.width = Math.floor(sw * DPR);
  strip.height = Math.floor(14 * DPR);
  strip.style.width = sw + 'px';
  strip.style.height = '14px';
  sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

function drawBase() {
  pctx.clearRect(0, 0, side, side);
  pctx.save();
  rr(pctx, 0, 0, side, side, 28);
  pctx.clip();
  if (square.width > 0) {
    pctx.drawImage(square, 0, 0, side, side);
  } else {
    pctx.fillStyle = '#ffffff';
    pctx.fillRect(0, 0, side, side);
  }
  // breathing veil while the brain is busy; steady dim when it failed
  if (!ready && !brainDead) {
    const a = 0.10 + 0.06 * Math.sin(tGlobal * 2.2);
    pctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
    pctx.fillRect(0, 0, side, side);
  } else if (brainDead) {
    pctx.fillStyle = 'rgba(228,224,216,0.28)';
    pctx.fillRect(0, 0, side, side);
  }
  pctx.restore();
}

function paintShade() {
  if (!feats || grid <= 0) return;
  if (mode === 'dream') {
    if (!dreamShown) return;
    mask.width = grid;
    mask.height = grid;
    const g = mask.getContext('2d');
    const img = g.createImageData(grid, grid);
    for (let i = 0; i < dreamShown.length / 3; i += 1) {
      const o = i * 4;
      img.data[o] = Math.floor(dreamShown[i * 3] * 255);
      img.data[o + 1] = Math.floor(dreamShown[i * 3 + 1] * 255);
      img.data[o + 2] = Math.floor(dreamShown[i * 3 + 2] * 255);
      img.data[o + 3] = 235;
    }
    g.putImageData(img, 0, 0);
    pctx.save();
    rr(pctx, 0, 0, side, side, 28);
    pctx.clip();
    pctx.imageSmoothingEnabled = true;
    pctx.drawImage(mask, 0, 0, side, side);
    pctx.restore();
    return;
  }
  const src = mode === 'gaze' ? gazeShown : shown;
  if (!src || grey.width === 0) return;
  if (mode === 'touch' && tapped < 0) return; // clean photo until first tap
  // Peak-normalize so the hottest patch always reads full color: touch peaks
  // at self-similarity 1, gaze peaks wherever CLS looks hardest.
  let mx = 0;
  for (let i = 0; i < src.length; i += 1) if (src[i] > mx) mx = src[i];
  if (mx < 1e-6) return; // similarities still fading in
  const inv = 1 / mx;
  // Grey spotlight with the old glow's soft falloff (simToAlpha): matches stay
  // full color, everything else fades to dark grey. Brightness cue only, so it
  // reads on any photo hue (orange fur included). No lines, no blockiness.
  mask.width = grid;
  mask.height = grid;
  const g = mask.getContext('2d');
  const img = g.createImageData(grid, grid);
  const pulse = mode === 'gaze' ? 0.9 + 0.1 * Math.sin(tGlobal * 1.6) : 1;
  for (let i = 0; i < src.length; i += 1) {
    const veil = 1 - clamp(simToAlpha(src[i] * inv, cut) * pulse, 0, 1);
    const o = i * 4;
    img.data[o] = 255;
    img.data[o + 1] = 255;
    img.data[o + 2] = 255;
    img.data[o + 3] = Math.floor(veil * 255);
  }
  g.putImageData(img, 0, 0);
  work.width = Math.max(2, Math.floor(side));
  work.height = Math.max(2, Math.floor(side));
  const w = work.getContext('2d');
  w.clearRect(0, 0, work.width, work.height);
  w.drawImage(grey, 0, 0, work.width, work.height);
  w.globalCompositeOperation = 'destination-in';
  w.imageSmoothingEnabled = true;
  w.drawImage(mask, 0, 0, work.width, work.height);
  w.globalCompositeOperation = 'source-over';
  pctx.save();
  rr(pctx, 0, 0, side, side, 28);
  pctx.clip();
  pctx.imageSmoothingEnabled = true;
  pctx.drawImage(work, 0, 0, side, side);
  pctx.restore();
}

function drawStrip() {
  sctx.clearRect(0, 0, N_BLOCKS * 22, 14);
  for (let i = 0; i < N_BLOCKS; i += 1) {
    const x = i * 22 + 11;
    let fill = 0.16;
    let r = 4;
    if (modelLoading) {
      const f = clamp(loadFrac * N_BLOCKS - i, 0, 1);
      fill = 0.16 + f * 0.84;
      r = 4 + f * 1.5;
    } else if (sweep >= 0) {
      const d = Math.abs(sweep - i);
      fill = clamp(1 - d / 3, 0.16, 1);
      r = 4 + clamp(1 - d / 3, 0, 1) * 2;
    } else if (brainDead) {
      fill = 0;
    } else {
      fill = 0.30 + 0.10 * Math.sin(tGlobal * 1.8 + i * 0.55);
    }
    sctx.fillStyle = brainDead && sweep < 0
      ? 'rgba(140,132,122,0.40)'
      : 'rgba(77,124,254,' + fill.toFixed(3) + ')';
    sctx.beginPath();
    sctx.arc(x, 7, r, 0, TAU);
    sctx.fill();
  }
}

function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  dt = clamp(dt, 0.001, 0.05);
  tGlobal += dt;
  if (sweep >= 0) {
    sweep += dt * 14;
    if (sweep > N_BLOCKS + 2) sweep = -1;
  }
  if (target && shown) {
    const k = smooth(dt, 6);
    for (let i = 0; i < shown.length; i += 1) shown[i] += (target[i] - shown[i]) * k;
  }
  if (clsSims && gazeShown) {
    const k = smooth(dt, 6);
    for (let i = 0; i < gazeShown.length; i += 1) gazeShown[i] += (clsSims[i] - gazeShown[i]) * k;
  }
  if (dreamRGB && dreamShown) {
    const k = smooth(dt, 5);
    for (let i = 0; i < dreamShown.length; i += 1) dreamShown[i] += (dreamRGB[i] - dreamShown[i]) * k;
  }
  for (let i = ripples.length - 1; i >= 0; i -= 1) {
    const rp = ripples[i];
    rp.r += dt * 120;
    rp.a *= Math.exp(-dt * 2.6);
    if (rp.a < 0.02) ripples.splice(i, 1);
  }
  drawBase();
  paintShade();
  pctx.save();
  rr(pctx, 0, 0, side, side, 28);
  pctx.clip();
  for (const rp of ripples) {
    pctx.strokeStyle = 'rgba(140,132,122,' + rp.a.toFixed(3) + ')';
    pctx.lineWidth = 1.5;
    pctx.beginPath();
    pctx.arc(rp.x, rp.y, rp.r, 0, TAU);
    pctx.stroke();
  }
  pctx.restore();
  drawStrip();
}

let processor = null;
let model = null;

async function ensureBrain(progress) {
  if (model) return true;
  const tries = [
    { dtype: 'q4', device: 'webgpu' },
    { dtype: 'q4', device: 'wasm' },
    { dtype: 'q8', device: 'wasm' },
  ];
  for (const opt of tries) {
    try {
      log('brain try ' + opt.dtype + '/' + opt.device);
      if (!processor) {
        processor = await AutoImageProcessor.from_pretrained(MODEL, { progress_callback: progress });
        log('processor ready');
      }
      model = await AutoModel.from_pretrained(MODEL, { ...opt, progress_callback: progress });
      log('brain ok: ' + opt.dtype + '/' + opt.device);
      return true;
    } catch (e) {
      log('brain fail ' + opt.dtype + '/' + opt.device + ': ' + (e && e.message ? e.message : e));
      model = null;
    }
  }
  return false;
}

async function infer() {
  if (!processor || !model || square.width === 0) return;
  sweep = 0;
  const t0 = performance.now();
  try {
    log('infer start ' + square.width + 'x' + square.height);
    const raw = await RawImage.read(square);
    const { pixel_values } = await processor(raw);
    log('pixels: [' + pixel_values.dims.join(',') + ']');
    const out = await model({ pixel_values });
    const rows = out.last_hidden_state.tolist()[0];
    const regs = model.config && model.config.num_register_tokens ? model.config.num_register_tokens : 4;
    const sliced = slicePatchTokens(rows, regs);
    grid = sliced.grid;
    dim = sliced.dim;
    feats = normalizeRows(sliced.patches, grid * grid, dim);
    const n = grid * grid;
    // gaze: CLS whole-image vector vs every patch
    const clsRaw = sliceCls(rows);
    let s = 0;
    for (let d = 0; d < dim; d += 1) s += clsRaw[d] * clsRaw[d];
    const inv = 1 / (Math.sqrt(s) || 1);
    clsSims = new Float32Array(n);
    for (let i = 0; i < n; i += 1) {
      let v = 0;
      for (let d = 0; d < dim; d += 1) v += feats[i * dim + d] * clsRaw[d] * inv;
      clsSims[i] = v;
    }
    gazeShown = new Float32Array(n);
    // dream: top-3 PCA of raw patch features -> colors
    const tDream = performance.now();
    dreamRGB = pca3(sliced.patches, n, dim);
    dreamShown = new Float32Array(n * 3);
    log('dream ok: ms=' + Math.round(performance.now() - tDream));
    target = new Float32Array(n);
    shown = new Float32Array(n);
    tapped = -1;
    ready = true;
    brainDead = false;
    log('infer ok: grid=' + grid + ' dim=' + dim + ' regs=' + regs + ' ms=' + Math.round(performance.now() - t0));
  } catch (e) {
    ready = false;
    brainDead = true;
    log('infer fail: ' + (e && e.message ? e.message : e));
    if (e && e.stack) log('trace: ' + String(e.stack).split('\n').slice(0, 5).join(' | '));
  }
}

function setPhoto(img) {
  const s = Math.min(img.naturalWidth, img.naturalHeight);
  const sx = (img.naturalWidth - s) / 2;
  const sy = (img.naturalHeight - s) / 2;
  const S = 448;
  square.width = S;
  square.height = S;
  square.getContext('2d').drawImage(img, sx, sy, s, s, 0, 0, S, S);
  // desaturated + dimmed copy for the grey spotlight (built once per photo)
  grey.width = S;
  grey.height = S;
  const gtx = grey.getContext('2d');
  gtx.drawImage(square, 0, 0);
  const gid = gtx.getImageData(0, 0, S, S);
  const gd = gid.data;
  for (let i = 0; i < gd.length; i += 4) {
    const lum = (gd[i] * 77 + gd[i + 1] * 150 + gd[i + 2] * 29) >> 8;
    const v = (lum * 62 / 100) | 0;
    gd[i] = v;
    gd[i + 1] = v;
    gd[i + 2] = v;
  }
  gtx.putImageData(gid, 0, 0);
  feats = null;
  target = null;
  shown = null;
  clsSims = null;
  gazeShown = null;
  dreamRGB = null;
  dreamShown = null;
  tapped = -1;
  ripples = [];
  ready = false;
  brainDead = false;
  if (model && processor) infer();
}

function loadSrc(src) {
  const img = new Image();
  img.onload = () => setPhoto(img);
  img.src = src;
}

const bTouch = document.getElementById('bTouch');
const bDream = document.getElementById('bDream');
const bGaze = document.getElementById('bGaze');

function setMode(m) {
  mode = m;
  bTouch.setAttribute('aria-pressed', String(m === 'touch'));
  bDream.setAttribute('aria-pressed', String(m === 'dream'));
  bGaze.setAttribute('aria-pressed', String(m === 'gaze'));
  log('mode=' + m);
}
bTouch.addEventListener('click', () => setMode('touch'));
bDream.addEventListener('click', () => setMode('dream'));
bGaze.addEventListener('click', () => setMode('gaze'));

function doTap(x, y) {
  if (!ready || !feats) {
    ripples.push({ x, y, r: 6, a: 0.45 });
    log('tap ignored: ready=' + ready + ' dead=' + brainDead + ' loading=' + modelLoading);
    return;
  }
  if (mode !== 'touch') setMode('touch');
  const cell = pointToCell(x, y, side, grid);
  if (cell < 0) return;
  tapped = cell;
  target = similarityMap(feats, grid * grid, dim, cell);
  let top = -2;
  let count = 0;
  for (let i = 0; i < target.length; i += 1) {
    if (target[i] > top) top = target[i];
    if (target[i] > 0.7) count += 1;
  }
  log('tap cell=' + tapped + ' self=' + target[tapped].toFixed(3) + ' max=' + top.toFixed(3) + ' hot=' + count);
  ripples.push({ x, y, r: 6, a: 0.55 });
}

photo.addEventListener('pointerdown', (ev) => {
  const rect = photo.getBoundingClientRect();
  downInfo = { x: ev.clientX - rect.left, y: ev.clientY - rect.top, t: performance.now() };
});

function endPointer(ev) {
  if (!downInfo) return;
  const d0 = downInfo;
  downInfo = null;
  const rect = photo.getBoundingClientRect();
  const x = ev.clientX - rect.left;
  const y = ev.clientY - rect.top;
  const dt = performance.now() - d0.t;
  if (dt < 600 && Math.hypot(x - d0.x, y - d0.y) < 14) doTap(x, y);
}
photo.addEventListener('pointerup', endPointer);
photo.addEventListener('pointercancel', () => { downInfo = null; });

senseEl.addEventListener('input', () => {
  cut = parseFloat(senseEl.value);
});
senseEl.addEventListener('change', () => {
  log('cut=' + cut.toFixed(2));
});

photo.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  cut = clamp(cut + ev.deltaY * 0.0006, 0.3, 0.9);
  senseEl.value = String(cut);
}, { passive: false });

function showSample(dir) {
  if (customURL) {
    URL.revokeObjectURL(customURL);
    customURL = null;
  }
  sampleIdx = (sampleIdx + dir + SAMPLES.length) % SAMPLES.length;
  loadSrc(SAMPLES[sampleIdx]);
}

bPrev.addEventListener('click', () => showSample(-1));
bNext.addEventListener('click', () => showSample(1));
bUp.addEventListener('click', () => file.click());
file.addEventListener('change', () => {
  if (!file.files || file.files.length === 0) return;
  if (customURL) URL.revokeObjectURL(customURL);
  customURL = URL.createObjectURL(file.files[0]);
  loadSrc(customURL);
  file.value = '';
});

window.addEventListener('resize', resize);

resize();
requestAnimationFrame((n) => {
  last = n;
  requestAnimationFrame(frame);
});
loadSrc(SAMPLES[sampleIdx]);

const seen = new Map();
const progress = (info) => {
  if (!info || !info.file) return;
  if (info.status === 'done') {
    seen.set(info.file, 1);
  } else if (info.status === 'progress' && info.total) {
    seen.set(info.file, clamp(info.loaded / info.total, 0, 1));
  } else if (!seen.has(info.file)) {
    seen.set(info.file, 0);
  }
  let s = 0;
  seen.forEach((v) => { s += v; });
  loadFrac = seen.size === 0 ? 0 : s / seen.size;
};

(async () => {
  log('boot; webgpu=' + (navigator.gpu ? 'yes' : 'no') + ' dpr=' + (window.devicePixelRatio || 1));
  const ok = await ensureBrain(progress);
  modelLoading = false;
  brainDead = !ok;
  log(ok ? 'brain loaded' : 'brain FAILED all tries');
  if (ok) infer();
})();
</script>
